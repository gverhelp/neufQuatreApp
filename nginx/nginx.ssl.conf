upstream NeufQuatre {
    server web:8000;
}

server {
    listen 80;
    server_name unitesaintaugustin94.be;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {

    listen 443 ssl;
    server_name unitesaintaugustin94.be;

    ssl_certificate /etc/letsencrypt/live/unitesaintaugustin94.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unitesaintaugustin94.be/privkey.pem;
    ssl_protocols TLSv1.3;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # Reverse proxy vers Django API
    location /api/ {
        proxy_pass http://NeufQuatre;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        client_max_body_size 100M;
    }

    # Fichiers média (uploads)
    location /media/ {
        alias /app/mediafiles/;
        autoindex off;
    }

    # Photos et vidéos des Radio Camps : jamais en accès direct.
    # Elles passent par Django (/api/radio-camps/photos|videos/<id>/file/), qui vérifie le mot de passe.
    location /media/radio_camp_photos/ { return 404; }
    location /media/radio_camp_videos/ { return 404; }

    # Location interne : utilisable uniquement via l'en-tête X-Accel-Redirect envoyé par Django
    location /protected-media/ {
        internal;
        alias /app/mediafiles/;
    }

    # Fichiers statiques Django (admin, etc.)
    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
    }
}
