name: Deploy to EC2

on:
  push:
    branches:
      - prod
  workflow_dispatch:

# Un seul déploiement à la fois ; un push pendant un déploiement attend son tour
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy to EC2
        run: |
          # Keepalive : évite que la connexion tombe pendant un build long
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 ${{ secrets.EC2_HOST }} 'bash -s' << 'EOF'
            # Stoppe au premier échec : le job passe en rouge au lieu d'afficher « successful »
            set -euo pipefail
            cd ${{ secrets.EC2_PATH }}
            # -p figé : garantit les mêmes noms de volumes (neufquatreapp_postgres_data, ...)
            COMPOSE="docker compose -p neufquatreapp -f docker-compose.prod.yml"

            echo "==> Syncing code with origin/prod"
            git fetch --prune origin prod
            git reset --hard origin/prod

            # Les anciens containers tournent toujours pendant le build.
            # Cache des layers conservé : seules les étapes dont les fichiers ont changé sont rejouées.
            # --pull : récupère les mises à jour de sécurité des images de base.
            # Une image après l'autre : en parallèle, pipenv + npm + vite saturent la RAM du serveur.
            echo "==> Building images"
            $COMPOSE build --pull web
            $COMPOSE build --pull nginx

            # Recrée uniquement les containers dont l'image ou la config a changé ; la DB n'est pas touchée
            echo "==> Recreating updated containers"
            $COMPOSE up -d --remove-orphans

            echo "==> Cleaning up"
            docker image prune -f || true
            docker builder prune -f --filter until=168h || true

            echo "==> Deployment successful"
          EOF
